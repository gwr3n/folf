[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "folf"
version = "1.0.1"
description = "First-order loss function library with Jensen partitioners and sampling utilities"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "FOLF Contributors" }
]
keywords = ["inventory", "loss-function", "stochastic", "optimization", "normal-distribution"]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "scipy>=1.11"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics"
]

[project.scripts]
folf-cli = "folf.cli:main"

[project.urls]
Homepage = "https://github.com/gwren/folf"
Repository = "https://github.com/gwren/folf"
Documentation = "https://github.com/gwren/folf#readme"
Changelog = "https://github.com/gwren/folf/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/gwren/folf/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "ruff>=0.6",
  "mypy>=1.11"
]

[tool.hatch.build.targets.wheel]
packages = ["src/folf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
no_site_packages = true
files = ["src/folf"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
